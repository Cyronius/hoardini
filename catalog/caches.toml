patterns = ['**\target']
regenerable = true
verdict_hint = "safe"
safe_unit = "the whole target folder, or target\\debug"
notes = "Cargo build output when the parent folder has Cargo.toml (also Maven when it has pom.xml). Rebuilt by `cargo build`; can be many GB. Deleting forces a full rebuild, which can take minutes. If no Cargo.toml/pom.xml sits beside it, treat as unknown."

[[entry]]
id = "cargo-registry"
name = "Cargo registry cache"
app = "Cargo"
category = "package-cache"
patterns = ['~\.cargo\registry', '~\.cargo\git']
regenerable = true
verdict_hint = "redownload"
notes = "Downloaded crate sources and git checkouts. Re-fetched on the next build; offline builds would fail until then."

[[entry]]
id = "rustup-toolchains"
name = "Rust toolchains"
app = "rustup"
category = "dev-tool"
patterns = ['~\.rustup\toolchains', '~\.rustup\downloads', '~\.rustup\tmp']
regenerable = true
verdict_hint = "redownload"
safe_unit = "one toolchain folder (`rustup toolchain uninstall`)"
unit = "children"
notes = "Installed Rust toolchains. Remove old ones with rustup; re-install with `rustup toolchain install`."

[[entry]]
id = "cargo-bin"
name = "Cargo home"
app = "Cargo"
category = "dev-tool"
patterns = ['~\.cargo']
regenerable = false
verdict_hint = "review"
unit = "container"
notes = "CARGO_HOME: installed binaries (bin\\), config and credentials. The registry/git subfolders are caches; the rest is not."

[[entry]]
id = "generic-build"

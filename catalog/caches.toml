regenerable = true
verdict_hint = "safe"
notes = "uv wheel/source cache; venvs created with uv hardlink into it, so they keep working after `uv cache clean` but lose the shared copy."

[[entry]]
id = "poetry-cache"
name = "Poetry cache"
app = "Poetry"
category = "package-cache"
patterns = ['%LOCALAPPDATA%\pypoetry\Cache']
regenerable = true
verdict_hint = "safe"
notes = "Poetry download and virtualenv cache. The virtualenvs folder inside is project environments; those rebuild with `poetry install`."

[[entry]]

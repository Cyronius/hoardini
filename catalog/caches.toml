name = "llama.cpp build output"
app = "llama.cpp"
category = "build-output"
patterns = ['**\llama.cpp\build', '**\llama.cpp\build-*']
regenerable = true
verdict_hint = "safe"
safe_unit = "the whole build folder"
notes = "CMake build tree of llama.cpp (binaries such as llama-server, GGML backends). Rebuilt with cmake; a GPU backend build can take many minutes."

[[entry]]
id = "dotnet-obj"
name = "MSBuild intermediate output"
app = ".NET / Visual Studio"
category = "build-output"
patterns = ['**\obj', '**\bin\Debug', '**\bin\Release']
regenerable = true
verdict_hint = "safe"
notes = "MSBuild/.NET intermediate and output folders, rebuilt by `dotnet build`. Check a .csproj/.sln exists nearby; other tools also use obj/bin."

[[entry]]
id = "vs-project-cache"
name = "Visual Studio solution cache"
app = "Visual Studio"
category = "cache"
patterns = ['**\.vs', '%LOCALAPPDATA%\Microsoft\VisualStudio\*\ComponentModelCache']
regenerable = true
verdict_hint = "safe"
notes = ".vs holds per-solution IntelliSense databases and user settings (window layout, breakpoints); VS rebuilds them, reopening the solution is slower the first time."

[[entry]]
id = "vs-installer-cache"
name = "Visual Studio installer packages"
app = "Visual Studio"
category = "installer-cache"
patterns = ['%ProgramData%\Microsoft\VisualStudio\Packages', '%LOCALAPPDATA%\Microsoft\VisualStudio\Packages']
regenerable = true
verdict_hint = "redownload"
cap = "review"
notes = "Offline installer payloads for installed VS components. Needed for repair/modify without network; Visual Studio Installer can re-download them."

[[entry]]
id = "package-cache-msi"

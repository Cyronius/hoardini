regenerable = true
verdict_hint = "redownload"
safe_unit = "the whole .venv folder"
notes = "Per-project Python environment. Recreated by `uv sync` or `pip install -r requirements.txt`; source code is not inside it."

[[entry]]
id = "pycache"
name = "Python bytecode cache"
app = "Python"
category = "cache"
patterns = ['**\__pycache__', '**\.pytest_cache', '**\.mypy_cache', '**\.ruff_cache']
regenerable = true
verdict_hint = "safe"
notes = "Compiled bytecode and tool caches. Regenerated automatically."

[[entry]]
id = "npm-cache"
name = "npm cache"

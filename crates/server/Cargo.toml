[package]
name = "hoardini-server"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures = "0.3.34"
hoardini-agent = { version = "0.1.0", path = "../agent" }
hoardini-core = { version = "0.1.0", path = "../core" }
hoardini-win = { version = "0.1.0", path = "../win" }
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
uuid = { version = "1.27.0", features = ["v7", "serde"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

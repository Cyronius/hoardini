[package]
name = "hoardini-specs"
version.workspace = true
edition.workspace = true
publish = false
autotests = false

[lib]
path = "lib.rs"

[[test]]
name = "specs"
path = "tests/specs.rs"

[dev-dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
hoardini-agent = { path = "../crates/agent" }
httpdate = "1.0.3"
hoardini-core = { path = "../crates/core" }
hoardini-server = { path = "../crates/server" }
hoardini-win = { path = "../crates/win" }
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
serde_json = "1.0.151"
sha2 = "0.10"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full", "test-util"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies]
workspace-hack = { version = "0.1", path = "../crates/workspace-hack" }

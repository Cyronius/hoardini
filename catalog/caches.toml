[[entry]]
id = "winget-cache"
name = "WinGet download cache"
app = "WinGet"
category = "installer-cache"
patterns = ['%TEMP%\WinGet']
regenerable = true
verdict_hint = "safe"
notes = "Installers winget downloaded before running them, one folder per package. winget usually removes them after a successful install; leftovers are safe to delete when no install is running."

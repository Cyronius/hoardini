[package]
name = "hoardini-specs"
version.workspace = true
edition.workspace = true
publish = false
autotests = false

[lib]
path = "lib.rs"

[[test]]
name = "index"
path = "index/tests/index.rs"

[[test]]
name = "hist"
path = "hist/tests/hist.rs"

[[test]]
name = "evid"
path = "evid/tests/evid.rs"

[[test]]
name = "agent"
path = "agent/tests/agent.rs"

[[test]]
name = "srv"
path = "srv/tests/srv.rs"

[[test]]
name = "policy"
path = "policy/tests/policy.rs"

[[test]]
name = "act"
path = "act/tests/act.rs"

[[test]]
name = "mem"
path = "mem/tests/mem.rs"

[[test]]
name = "prov"
path = "prov/tests/prov.rs"

[[test]]
name = "runtime"
path = "runtime/tests/runtime.rs"

[[test]]
name = "vault"
path = "vault/tests/vault.rs"

[[test]]
name = "srch"
path = "srch/tests/srch.rs"

[[test]]
name = "agent_approval"
path = "agent/tests/approval.rs"

[dev-dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
hoardini-agent = { path = "../crates/agent" }
httpdate = "1.0.3"
hoardini-core = { path = "../crates/core" }
hoardini-server = { path = "../crates/server" }
hoardini-win = { path = "../crates/win" }
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
serde_json = "1.0.151"
sha2 = "0.10"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full", "test-util"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[package]
name = "hoardini-specs"
version.workspace = true
edition.workspace = true
publish = false
autotests = false

[lib]
path = "lib.rs"

[[test]]
name = "index"
path = "index/tests/index.rs"

[[test]]
name = "hist"
path = "hist/tests/hist.rs"

[[test]]

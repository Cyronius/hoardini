regenerable = false
verdict_hint = "review"
cap = "review"
unit = "children"
notes = "Cached MSI/EXE installers that setup bundles (Visual Studio, SQL Server, .NET, VC++ runtimes) use for repair and uninstall. Deleting entries can make uninstall or repair fail asking for the original media."

[[entry]]
id = "nuget-global-packages"
name = "NuGet global packages"
app = "NuGet"
category = "package-cache"
patterns = ['~\.nuget\packages']
regenerable = true
verdict_hint = "redownload"
notes = "Restored NuGet packages shared by all projects. `dotnet restore` re-downloads whatever a project needs; offline builds fail until then."

[[entry]]
id = "nuget-http-cache"
name = "NuGet HTTP cache"
app = "NuGet"
category = "package-cache"
patterns = ['%LOCALAPPDATA%\NuGet\v3-cache', '%LOCALAPPDATA%\NuGet\plugins-cache', '%LOCALAPPDATA%\NuGet\Cache', '%TEMP%\NuGetScratch']
regenerable = true
verdict_hint = "safe"
notes = "NuGet metadata and download caches (`dotnet nuget locals all --clear`). Rebuilt on demand."

[[entry]]

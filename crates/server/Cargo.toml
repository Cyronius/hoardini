[package]
name = "hoardini-server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures = "0.3.34"
hoardini-agent = { version = "0.1.0", path = "../agent" }
hoardini-core = { version = "0.1.0", path = "../core" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
uuid = { version = "1.27.0", features = ["v7", "serde"] }

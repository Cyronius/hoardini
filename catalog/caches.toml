regenerable = true
verdict_hint = "redownload"
safe_unit = "one venv folder"
unit = "children"
notes = "Python virtual environments kept in one place. Recreatable with pip/uv from a requirements file; may include large wheels such as torch and CUDA builds."

[[entry]]
id = "project-venv"
name = "Project virtualenv"
app = "Python"
category = "dev-tool"

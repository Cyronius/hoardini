regenerable = true
verdict_hint = "safe"
notes = "Extracted conda packages; environments hardlink into it. Use `conda clean --all` rather than deleting by hand so linked environments stay intact."

[[entry]]
id = "conda-envs"
name = "conda environments"
app = "conda"
category = "dev-tool"

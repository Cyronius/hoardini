patterns = ['%LOCALAPPDATA%\Yarn\Cache', '~\.bun\install\cache', '~\.cache\yarn']
regenerable = true
verdict_hint = "safe"
notes = "Package download caches. Re-fetched when needed."

[[entry]]
id = "node-modules"
name = "node_modules"
app = "Node.js"
category = "build-output"
patterns = ['**\node_modules']
regenerable = true
verdict_hint = "redownload"
safe_unit = "the whole node_modules folder"
notes = "Installed JavaScript dependencies. `npm/pnpm/bun install` recreates it from package.json and the lockfile; needs network. Deleting loses nothing unless dependencies were patched in place."

[[entry]]
id = "nextjs-build"
name = "JS framework build caches"
app = "Node.js"
category = "build-output"
patterns = ['**\.next', '**\.nuxt', '**\.turbo', '**\.parcel-cache', '**\.svelte-kit', '**\.angular\cache', '**\.vite']
regenerable = true
verdict_hint = "safe"
notes = "Build output and caches of web frameworks and bundlers. Regenerated by the next dev/build run."

[[entry]]
id = "rust-target"
name = "Rust target directory"
app = "Cargo"

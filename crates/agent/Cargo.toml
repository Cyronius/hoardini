[package]
name = "hoardini-agent"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
futures = "0.3.34"
hoardini-core = { version = "0.1.0", path = "../core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.27.0", features = ["v7", "serde"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "test-util"] }
